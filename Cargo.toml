[package]
name = "multistream-manager"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "Terminal UI for configuring and going live on Twitch and YouTube simultaneously"
license = "MIT"
repository = "https://github.com/worxbend/multistream-manager"
readme = "README.md"
keywords = ["twitch", "youtube", "streaming", "tui", "obs"]
categories = ["command-line-utilities", "multimedia"]

[[bin]]
name = "msm"
path = "src/main.rs"

[dependencies]
# Async runtime. "rt-multi-thread" lets the stats poller run on a worker thread
# while the terminal UI keeps redrawing on the main one.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }

# HTTP client. rustls-tls avoids depending on the system OpenSSL, which keeps
# the binary portable across distros.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

# rustls itself, as a direct dependency only so main.rs can install a default
# crypto provider explicitly at start-up. reqwest asks rustls for the "ring"
# backend but tokio-tungstenite/twitch-irc pull in rustls with its own default
# features, which is "aws-lc-rs" — both end up compiled in, and with two
# candidates present rustls refuses to guess which one to use, panicking on
# the very first TLS handshake instead. Picking one here, once, before any
# connection code runs, is what rustls's own panic message asks for.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

# Terminal UI.
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio-stream = "0.1"

# Small, focused ratatui ecosystem widgets, used only where they are a strict
# upgrade over a hand-rolled equivalent with zero new App state: a checkbox
# marker glyph, a per-platform viewer-share piechart, and a scrolling list
# widget that replaces manual visible-window math.
tui-checkbox = "0.4.6"
tui-piechart = "1.0.2"
tui-widget-list = "0.15.2"

# Serialisation: JSON for the APIs, TOML for the on-disk config.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# A comment-preserving TOML editor. Saving from the TUI has to write values back
# into config.toml without throwing away the explanatory comments `msm init`
# wrote, and a plain serialise-the-struct round trip cannot do that: comments are
# not fields.
toml_edit = "0.22"

# Error handling. anyhow for propagating, thiserror for typed API errors.
anyhow = "1"
thiserror = "2"

# Timestamps for scheduledStartTime and uptime counters.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Locating the per-user config directory in an OS-correct way.
directories = "5"

# Opening the system browser for the OAuth consent screen.
open = "5"

# PKCE code challenge generation (Google requires it, Twitch tolerates it).
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# Percent-encoding for building OAuth URLs and API query strings safely.
urlencoding = "2"

# Twitch IRC chat transport for the Chat tab. Handles the TLS connection,
# capability negotiation, IRCv3 tag parsing, reconnection and join/send rate
# limiting — the same division of labor as the reference implementation
# (`twi`), which sits on go-twitch-irc. rustls to match reqwest.
twitch-irc = { version = "6", default-features = false, features = ["transport-tcp-rustls-webpki-roots"] }

# Grapheme-cluster segmentation and terminal cell widths, for chat text.
# Truncating a message by bytes or chars can split an emoji in half; both
# reference implementations cut on grapheme boundaries and so does this port.
unicode-segmentation = "1"
unicode-width = "0.2"

# Cross-process advisory file locking, used to serialise read-modify-write
# cycles on tokens.json so two concurrent msm processes cannot erase each
# other's freshly saved logins. (std gained File::lock in Rust 1.89, one
# release past this crate's MSRV of 1.88, so a crate has to provide it.)
fs4 = { version = "0.13", features = ["sync"] }

# The OBS control pane speaks obs-websocket 5, which is a WebSocket protocol.
# Only the client half is needed, and `rustls` rather than the system TLS to
# match reqwest — though in practice OBS listens on plain `ws://localhost`,
# because it has no TLS of its own. TLS is here for the case where somebody
# has put a tunnel in front of it.
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
# Splitting a WebSocket into its reading and writing halves, so one task can
# await incoming messages while requests are sent from elsewhere.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Structured logging to a file (the TUI owns stdout, so logs cannot go there).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# One system call, and only on Unix: restoring the default handling of a
# closed pipe. Without it, `msm obs status | head` ends in a Rust panic
# message rather than quietly, the way every other Unix tool does. libc is
# already in the dependency tree several times over, so naming it directly
# costs nothing.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "test-util"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
