name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories are published against code that has not changed, so waiting for
  # somebody to push is waiting for the wrong signal. Monday morning, UTC.
  schedule:
    - cron: "0 7 * * 1"

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any warning, so dead code and lints cannot accumulate.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The test suite makes no network calls, so it runs identically on
      # every platform and needs no credentials.
      - name: Run tests
        run: cargo test --all-targets

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must match `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

  # Known vulnerabilities and licence problems in the dependency tree.
  #
  # This program handles OAuth tokens and talks to two APIs over TLS, and
  # nothing else in CI would notice an advisory published against a crate three
  # levels down. cargo-deny is used rather than cargo-audit alone because it
  # checks licences and duplicate versions in the same pass, and this is an MIT
  # project that should not be shipping a dependency nobody may redistribute.
  supply-chain:
    name: Advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources
