# cargo-deny: what this project will and will not ship.
#
# Run it locally the same way CI does:
#
#     cargo install cargo-deny
#     cargo deny check
#
# The point of the file is that the answers are written down and reviewable,
# rather than living in whoever last looked at the dependency tree.

[advisories]
# Anything with a published advisory fails the build. There are no exceptions
# in this list, and an exception added here should carry a comment saying why
# the advisory does not apply to how this program uses the crate.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. This program is MIT and is distributed as a
# prebuilt binary, so a copyleft dependency would put an obligation on
# everybody who downloads a release — not something to discover after the fact.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions of the same crate are a warning rather than an error:
# they are worth seeing, and in a tree this size one is usually a transitive
# dependency nobody here can fix today.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Everything comes from crates.io. A git dependency is a fine thing to add
# deliberately and a bad thing to acquire by accident.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
